---
#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en"> <!--<![endif]-->
{% include head.html %}

<body>
  <div class="page-actions d-print-none" aria-label="CV actions">
    <button type="button" class="language-button" id="languageButton" aria-pressed="false">
      <i class="fas fa-language" aria-hidden="true"></i><span data-language-label>한국어</span>
    </button>

    <button type="button" onclick="print()" class="print-button">
      <i class="fas fa-print" aria-hidden="true"></i>Print
    </button>

    <button type="button" onclick="generatePDF()" class="pdf-button" id="pdfButton">
      <i class="fas fa-file-pdf" aria-hidden="true"></i>PDF
    </button>
  </div>

  <div class="wrapper">
    {% include sidebar.html %}

    <div class="main-wrapper">
      {{ content }}
    </div>
  </div>

  {% include footer.html %}

  {% include scripts.html %}
  <script src="{{ site.baseurl }}/assets/js/language-toggle.js"></script>
  <script src="{{ site.baseurl }}/assets/js/pdf-generator.js?v=11"></script>
</body>

</html>
